apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: spc-orderproc-worker
  namespace: orderproc
spec:
  provider: azure
  secretObjects:
    - secretName: redis-secret
      type: Opaque
      data:
        - objectName: redis-connection-string
          key: REDIS_CONNECTION_STRING
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "1c547be5-72a1-4ab4-9964-43d299142b75"
    keyvaultName: "kv-orderproc-dev01"
    tenantId: "2e8cb550-807a-4e5c-81ce-6b06740b6dfe"
    objects: |
      array:
        - |
          objectName: redis-connection-string
          objectType: secret